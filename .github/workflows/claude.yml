# @claude dans une issue ou une PR (réservé aux membres ayant l'accès en écriture).
# Prérequis : app GitHub Claude installée sur le dépôt + secret CLAUDE_CODE_OAUTH_TOKEN
# (claude setup-token). Phase 2 : remplacer par ANTHROPIC_API_KEY de l'association.
#
# Circuit d'une issue, en deux temps verrouillés :
#   1. plan         : « @claude » (issue ouverte ou commentaire) → Claude reformule, propose un plan,
#                     pose ses questions. Lecture seule : jeton GITHUB_TOKEN sans écriture sur le
#                     contenu, outils de modification et Bash interdits.
#   2. realisation  : commentaire « @claude go » → Claude travaille sur une branche contenu/N-titre
#                     partie de recette.
#   3. vers-recette : PR de cette branche vers recette, CI, puis fusion en merge commit
#                     (.github/scripts/vers-recette.sh). Le résultat est signalé dans l'issue.
# Dans une PR (relecture), Claude agit directement : job « pr ».
#
# Syntaxe de claude_args (anthropics/claude-code-action v1) : arguments shell ; une ligne qui
# commence par # est ignorée. Pas de guillemet droit (") ni de $ dans les consignes.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  # Seulement « opened » : l'action ne réagit pas à « edited », ni à « assigned » sans assignee_trigger.
  # @claude ajouté après coup va donc dans un commentaire (voir le gabarit d'issue).
  issues:
    types: [opened]

env:
  PREPROD_RECETTE: https://amis-etanglaville-git-recette-amis-etang-la-ville.vercel.app
  CONSIGNE_COMMUNE: >-
    Tu travailles sur le site de l'association Les Amis de L'Étang-la-Ville. Les personnes qui
    t'écrivent sont des bénévoles non techniciens : réponds en français, en langage simple, sans
    jargon (pas de commit, branche, Markdown, YAML, front matter…). Respecte AGENTS.md : aucun style
    dans le contenu, médias dans public/medias/AAAA/MM/ référencés en /medias/AAAA/MM/fichier
    (jamais d'adresse raw.githubusercontent.com), texte alternatif pour chaque image porteuse de sens.

jobs:
  plan:
    if: |
      github.event.sender.type != 'Bot' && (
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
        (github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
          contains(github.event.comment.body, '@claude') && !contains(github.event.comment.body, '@claude go'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Le jeton passé à l'action est le GITHUB_TOKEN : il ne peut rien écrire dans le dépôt,
    # seulement commenter l'issue (l'app Claude, elle, aurait l'écriture).
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          display_report: true
          claude_args: |
            --model sonnet
            --max-turns 30
            --disallowedTools "Edit,MultiEdit,Write,NotebookEdit,Bash,mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files"
            --append-system-prompt "${{ env.CONSIGNE_COMMUNE }}
            ÉTAPE PLAN : tu ne modifies rien (tu n'en as d'ailleurs pas les moyens), tu prépares le travail.
            Dans ton commentaire : 1) reformule la demande en langage simple ; 2) propose un plan court :
            pages touchées (adresse /slug/ et titre), ce qui change sur chacune, images ou documents
            nécessaires et s'ils sont fournis ; 3) pose toutes les questions utiles dès qu'il y a la moindre
            ambiguïté (texte exact, emplacement, image manquante, date…), sous forme de liste numérotée.
            Termine toujours par : Répondez à mes questions en commentaire si besoin, puis écrivez
            « @claude go » dans un nouveau commentaire pour lancer la réalisation.
            Si la demande est déjà réalisée ou hors du site, dis-le simplement."

  realisation:
    if: |
      github.event.sender.type != 'Bot' &&
      github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude go')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-issue-${{ github.event.issue.number }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    outputs:
      branche: ${{ steps.claude.outputs.branch_name }}
      resultat: ${{ steps.claude.outputs.structured_output }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: ./.github/actions/installer
      - id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          display_report: true
          base_branch: recette
          branch_prefix: 'contenu/'
          branch_name_template: '{{prefix}}{{entityNumber}}-{{description}}'
          claude_args: |
            --model sonnet
            --max-turns 30
            --allowedTools "Bash(npm run build),Bash(npm run check),Bash(npm run format),Bash(npm run redirects)"
            --json-schema '{"type":"object","properties":{"travail_termine":{"type":"boolean","description":"true si la demande est entièrement réalisée, vérifiée et poussée ; false si tu t es arrêté pour poser une question ou si tu n as pas pu finir"}},"required":["travail_termine"]}'
            --append-system-prompt "${{ env.CONSIGNE_COMMUNE }}
            ÉTAPE RÉALISATION : la demande a été validée par « @claude go ». Suis le plan validé dans le fil
            de l'issue (ton commentaire de plan et les réponses qui suivent). Tu pars de la branche recette
            (préproduction relue par le bureau) : ne vise jamais main et n'ouvre pas de PR toi-même.
            À la fin, le workflow ouvre une PR vers recette et l'intègre automatiquement si la CI est verte.
            En cas de doute en cours de route, ne suppose rien : ne pousse aucune modification, pose la
            question dans ton commentaire, demande de répondre puis d'écrire de nouveau « @claude go », et
            réponds travail_termine=false. Avant de terminer, npm run check et npm run build doivent passer.
            Dans ton commentaire final, liste les pages concernées (adresse /slug/) à relire sur la
            préproduction de la recette : ${{ env.PREPROD_RECETTE }}"

  vers-recette:
    needs: realisation
    if: needs.realisation.outputs.branche != '' && fromJSON(needs.realisation.outputs.resultat || '{}').travail_termine == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write # lancer la CI (workflow_dispatch) et suivre son exécution
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
      - name: PR vers recette, CI, puis fusion
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCHE: ${{ needs.realisation.outputs.branche }}
          BASE: recette
          ISSUE: ${{ github.event.issue.number }}
          TITRE_ISSUE: ${{ github.event.issue.title }}
          PREPROD: ${{ env.PREPROD_RECETTE }}
          DETAIL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/vers-recette.sh

  pr:
    if: |
      github.event.sender.type != 'Bot' && (
        (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: ./.github/actions/installer
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          display_report: true
          claude_args: |
            --model sonnet
            --max-turns 30
            --allowedTools "Bash(npm run build),Bash(npm run check),Bash(npm run format),Bash(npm run redirects)"
            --append-system-prompt "${{ env.CONSIGNE_COMMUNE }}
            RELECTURE D'UNE PR : applique directement la demande sur la branche de la PR, sans changer la
            branche visée. S'il y a la moindre ambiguïté, ne modifie rien : pose la question dans ton
            commentaire et arrête-toi. Avant de terminer, npm run check et npm run build doivent passer."
