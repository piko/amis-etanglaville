# Installation pour la CI : Node (version de .nvmrc, cache npm) puis dépendances. À appeler après
# actions/checkout. Pas dans claude.yml : voir le commentaire là-bas.
name: Installer
description: Node et dépendances du projet
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version-file: .nvmrc
        cache: npm
    - run: npm ci
      shell: bash
