# Étapes communes à la CI et aux jobs Claude qui modifient le site : Node (version de .nvmrc,
# cache npm) puis dépendances. À appeler après actions/checkout.
name: Installer
description: Node et dépendances du projet
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version-file: .nvmrc
        cache: npm
    - run: npm ci
      shell: bash
