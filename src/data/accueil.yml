# Page d’accueil (src/pages/index.astro). Les actualités et le dernier bulletin s’affichent automatiquement.
hero:
  surtitre: "Depuis 1960"
  titre: "Nous défendons notre environnement"
  texte: "Association non partisane, nous protégeons la forêt, les paysages et le patrimoine de L’Étang-la-Ville, et nous informons ses habitants des projets qui engagent notre cadre de vie."
  image: "/medias/accueil/vuillard-window-overlooking-the-woods.jpg"
  alt: "Tableau d’Édouard Vuillard : depuis une fenêtre, un vallon boisé aux couleurs d’automne, un clocher et des toits entre les arbres."
  legende: "Édouard Vuillard, « Window Overlooking the Woods », 1899. Art Institute of Chicago. Le peintre nabi séjournait souvent à L’Étang-la-Ville."
missions:
  - titre: "Protéger l’environnement et la biodiversité"
    texte: "Concertation sur les projets d’urbanisme et d’infrastructure, pour un cadre de vie « entre ville et forêt »."
  - titre: "Préserver le patrimoine"
    texte: "Château, lavoir de la Montagne, fontaine Saint-Pierre, croix Saint-Michel : le patrimoine historique et artistique du village."
  - titre: "Informer les habitants"
    texte: "Bulletins, réunions et site internet pour partager les enjeux de la commune."
# Suite de la phrase « 184 cartes postales anciennes, … » (le nombre est calculé)
memoire: "les seigneurs de l’Étang, les peintres nabis, les trains et le tram 13, les restaurants du temps passé."
succes:
